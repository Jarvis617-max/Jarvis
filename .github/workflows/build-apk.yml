name: Build JARVIS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project
        shell: bash
        run: |
          set -e

          mkdir -p source

          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP dosyasi bulunamadi"
            exit 1
          fi

          echo "ZIP: $ZIP"
          unzip -q "$ZIP" -d source

          PROJECT=$(find source -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT" ]; then
            echo "Android projesi bulunamadi"
            find source -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Android projesi: $PROJECT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -e

          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi

          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
